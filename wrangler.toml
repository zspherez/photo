# Cloudflare Pages config — used for the canonical (rehders.photos) deploy and
# for `wrangler pages dev`.
#
# The GitHub Pages deploy ignores this file entirely (it builds a static site).

name = "photo"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "rehders-photo-originals"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rehders-photo-media"
